[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "careamics-reproducibility"
version = "0.1.0"
description = "Paper reproducibility experiments across denoising backends."
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "careamics",
    "careamics-portfolio",
    "gdown",
    "ipython>=8.39.0",
    "numpy",
    "pillow",
    "tensorboard>=2.21.0",
    "tifffile>=2026.3.3",
    "typer>=0.27.2",
    "wandb",
]

[tool.uv.sources]
careamics = { git = "https://github.com/CAREamics/careamics.git", rev = "dev/microsplit_api" }

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/datasets"]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88
