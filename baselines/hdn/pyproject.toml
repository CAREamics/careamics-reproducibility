[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hdn-baseline"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "numpy==2.4.6",
    "scikit-image==0.26.0",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "tqdm",
    "tifffile",
    "careamics-portfolio",
    "typer",
    "wandb",
]

[tool.hatch.build]
dev-mode-dirs = ["../../src", "HDN"]

[tool.hatch.build.targets.wheel]
bypass-selection = true
